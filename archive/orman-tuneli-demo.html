<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><title>Orman Tüneli + Yol Ayrımı</title>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#cfe6dc;font-family:system-ui,sans-serif}canvas{display:block}
#hud{position:fixed;left:12px;top:10px;color:#fff;text-shadow:0 1px 3px #000;font-weight:700;font-size:15px;line-height:1.5}
#big{position:fixed;left:0;right:0;top:22%;text-align:center;color:#fff;font:800 34px system-ui;text-shadow:0 2px 6px #000;opacity:0;transition:opacity .3s}</style></head>
<body><div id="hud"></div><div id="big"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ================= 0) SAHNE ================= */
var renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));            // mobil: piksel yükünü sınırla
renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
var scene=new THREE.Scene(),SKY=0xcfe6dc;scene.background=new THREE.Color(SKY);
scene.fog=new THREE.FogExp2(SKY,.011);                              // 3) atmosferik "ışık/sis" hilesi
var cam=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.5,600);
scene.add(new THREE.HemisphereLight(0xfff4d8,0x4a7a3a,.95));
var sun=new THREE.DirectionalLight(0xfff0c0,.8);sun.position.set(30,80,20);scene.add(sun);
var ROAD_W=14,UP=new THREE.Vector3(0,1,0);
function rnd(a,b){return a+Math.random()*(b-a)}

/* ================= 1) YOL: CatmullRomCurve3 + AYRIM ================= */
var main=new THREE.CatmullRomCurve3([[0,0,0],[0,6,-120],[40,24,-230],[110,40,-300],[220,26,-320],[320,2,-380],
  [380,-14,-480],[360,8,-600],[300,34,-700],[300,22,-820],[340,0,-920]].map(function(a){return new THREE.Vector3(a[0],a[1],a[2])}),false,"catmullrom",.5);
var LM=main.getLength(),F_SPLIT=.30,F_MERGE=.62,DS=F_SPLIT*LM,DM=F_MERGE*LM;
function frameAt(c,f){var p=c.getPointAt(Math.min(1,Math.max(0,f))),t=c.getTangentAt(Math.min(1,Math.max(0,f)));t.y=0;t.normalize();
  return {p:p,t:t,tt:c.getTangentAt(Math.min(1,Math.max(0,f))),s:new THREE.Vector3().crossVectors(UP,t).normalize()}}          // s = yolun SOLU
var A=frameAt(main,F_SPLIT),B=frameAt(main,F_MERGE),Mid=frameAt(main,(F_SPLIT+F_MERGE)/2);
function branch(side,bulge){          // side:+1 sol, -1 sağ ; bulge: yanal sapma (iki kolun uzunluğu farklı olsun)
  var m1=frameAt(main,F_SPLIT+(F_MERGE-F_SPLIT)*.3),m2=frameAt(main,F_SPLIT+(F_MERGE-F_SPLIT)*.7);
  return new THREE.CatmullRomCurve3([A.p.clone(),A.p.clone().addScaledVector(A.t,26),
    m1.p.clone().addScaledVector(m1.s,side*bulge*.8),Mid.p.clone().addScaledVector(Mid.s,side*bulge),m2.p.clone().addScaledVector(m2.s,side*bulge*.8),
    B.p.clone().addScaledVector(B.t,-26),B.p.clone()],false,"catmullrom",.5)}
var BR={L:branch(1,62),R:branch(-1,88)};BR.L.len=BR.L.getLength();BR.R.len=BR.R.getLength();
var segs=[{c:main,f0:0,f1:F_SPLIT,n:40,y:0,name:"main1"},{c:BR.L,f0:0,f1:1,n:60,y:.03,name:"L"},{c:BR.R,f0:0,f1:1,n:70,y:.06,name:"R"},{c:main,f0:F_MERGE,f1:1,n:60,y:0,name:"main2"}];

/* yol şeridi (ribbon) — her parça tek mesh */
var roadMat=new THREE.MeshLambertMaterial({color:0x6f7378,flatShading:true,side:THREE.DoubleSide}),lineMat=new THREE.MeshBasicMaterial({color:0xf2e6a0,side:THREE.DoubleSide});
function ribbon(seg,w,mat,dy){
  var pos=[],idx=[],i;for(i=0;i<=seg.n;i++){var f=seg.f0+(seg.f1-seg.f0)*i/seg.n,fr=frameAt(seg.c,f);
    pos.push(fr.p.x+fr.s.x*w/2,fr.p.y+seg.y+dy,fr.p.z+fr.s.z*w/2, fr.p.x-fr.s.x*w/2,fr.p.y+seg.y+dy,fr.p.z-fr.s.z*w/2);
    if(i<seg.n){var k=i*2;idx.push(k,k+2,k+1, k+1,k+2,k+3)}}
  var g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);g.computeVertexNormals();
  var m=new THREE.Mesh(g,mat);m.frustumCulled=false;scene.add(m)}
segs.forEach(function(s){ribbon(s,ROAD_W,roadMat,.02);ribbon(s,.5,lineMat,.07)});
/* ARAZİ: yola en yakın noktanın yüksekliğini izler, yoldan uzaklaştıkça aşağı iner → yol sırtta/yamaçta kalır */
var SP=[];[main,BR.L,BR.R].forEach(function(c){for(var i=0;i<=160;i++){var q=c.getPointAt(i/160);SP.push(q.x,q.y,q.z)}});
function groundH(x,z){var best=1e9,by=0;for(var i=0;i<SP.length;i+=3){var dx=SP[i]-x,dz=SP[i+2]-z,dd=dx*dx+dz*dz;if(dd<best){best=dd;by=SP[i+1]}}
  var dist=Math.sqrt(best);return by-1.2-.16*Math.max(0,dist-9)+Math.sin(x*.045)*Math.cos(z*.05)*3.5}
(function(){var W=1400,H=1800,nx=70,nz=90,g=new THREE.PlaneGeometry(W,H,nx,nz);g.rotateX(-Math.PI/2);g.translate(200,0,-460);
  var P=g.attributes.position,col=[],c=new THREE.Color();
  for(var i=0;i<P.count;i++){var y=groundH(P.getX(i),P.getZ(i));P.setY(i,y);c.setHSL(.27+Math.random()*.03,.45,.26+Math.random()*.06);col.push(c.r,c.g,c.b)}
  g.setAttribute("color",new THREE.Float32BufferAttribute(col,3));g.computeVertexNormals();
  scene.add(new THREE.Mesh(g,new THREE.MeshLambertMaterial({vertexColors:true,flatShading:true})))})();

/* ================= 2) PROSEDÜREL TÜNEL: InstancedMesh (3 draw call) ================= */
var GREENS=[0x2f7a2a,0x3f8a2c,0x4f9a2f,0x5aa832,0x6bb83a,0x2a6a26],trunkM=[],crownM=[];
function addTunnel(c,f0,f1,spacing,skipNear){
  var len=c.getLength(),n=Math.floor((f1-f0)*len/spacing);
  for(var i=0;i<=n;i++){var fr=frameAt(c,f0+(f1-f0)*i/n),dummy=new THREE.Object3D();
    [-1,1].forEach(function(sg){var x=fr.p.x+fr.s.x*sg*(ROAD_W/2+2.6),z=fr.p.z+fr.s.z*sg*(ROAD_W/2+2.6);
      trunkM.push({x:x,y:fr.p.y+6-.5,z:z,sx:1.5,sy:12,sz:1.5,c:0xffffff})});
    for(var k=0;k<=6;k++){var th=k/6*Math.PI,R=ROAD_W/2+3;                       // yarım daire: sol gövde → tepe → sağ gövde
      var x2=fr.p.x+fr.s.x*Math.cos(th)*R+rnd(-1,1),z2=fr.p.z+fr.s.z*Math.cos(th)*R+rnd(-1,1),y2=fr.p.y+11+Math.sin(th)*8+rnd(-.8,.8);
      if(Math.sin(th)>.9&&Math.random()<.25)continue;                            // tepede bazen boşluk → ışık sızar
      crownM.push({x:x2,y:y2,z:z2,s:rnd(4.4,6.2),c:GREENS[(Math.random()*6)|0]})}}
}
addTunnel(main,.03,F_SPLIT-.02,15);                // ana yol — ayrımdan önce
addTunnel(BR.L,.1,.92,15);addTunnel(BR.R,.1,.92,15);   // iki kol
addTunnel(main,F_MERGE+.02,.97,15);
/* dağınık dev ağaçlar (yol dışı) */
for(var q=0;q<140;q++){var fr=frameAt(main,Math.random()),side=(Math.random()<.5?-1:1)*rnd(ROAD_W/2+14,150),x=fr.p.x+fr.s.x*side,z=fr.p.z+fr.s.z*side;
  var gy=groundH(x,z);trunkM.push({x:x,y:gy+7-.5,z:z,sx:2,sy:14,sz:2,c:0xffffff});for(var kk=0;kk<3;kk++)crownM.push({x:x+rnd(-4,4),y:gy+15+rnd(-2,4),z:z+rnd(-4,4),s:rnd(6,9),c:GREENS[(Math.random()*6)|0]})}
function makeInst(geo,mat,list,isCrown){
  var m=new THREE.InstancedMesh(geo,mat,list.length),d=new THREE.Object3D(),col=new THREE.Color();
  list.forEach(function(o,i){d.position.set(o.x,o.y,o.z);d.rotation.set(0,Math.random()*6.28,0);
    if(isCrown)d.scale.set(o.s,o.s*.78,o.s);else d.scale.set(o.sx,o.sy,o.sz);d.updateMatrix();m.setMatrixAt(i,d.matrix);m.setColorAt(i,col.set(o.c))});
  m.instanceMatrix.needsUpdate=true;m.frustumCulled=false;scene.add(m);return m}
/* KABUK DOKUSU: dikey çatlaklar (canvas, tek sefer) */
var barkTex=(function(){var c=document.createElement("canvas");c.width=64;c.height=128;var g=c.getContext("2d");g.fillStyle="#6a4c34";g.fillRect(0,0,64,128);
  for(var i=0;i<90;i++){var x=Math.random()*64,w=1+Math.random()*3;g.fillStyle="rgba("+(Math.random()<.5?"30,20,12":"140,104,70")+","+(.18+Math.random()*.3)+")";g.fillRect(x,Math.random()*128,w,20+Math.random()*80)}
  var t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(2,3);return t})();
makeInst(new THREE.CylinderGeometry(.7,1,1,8),new THREE.MeshLambertMaterial({map:barkTex}),trunkM,false);              // gövdeler: 1 çağrı
/* YAPRAK DOKUSU: tek kart üzerinde ~40 gerçek yaprak şekli (orta damarlı, ucu sivri) + şeffaf zemin */
var leafTex=(function(){var S=256,c=document.createElement("canvas");c.width=c.height=S;var g=c.getContext("2d");
  for(var i=0;i<46;i++){var x=40+Math.random()*176,y=40+Math.random()*176,a=Math.random()*6.28,L=26+Math.random()*20,W=L*.38,h=70+Math.random()*30,l=18+Math.random()*28;
    g.save();g.translate(x,y);g.rotate(a);
    g.fillStyle="hsl("+h+",55%,"+l+"%)";g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(L*.5,-W,L,0);g.quadraticCurveTo(L*.5,W,0,0);g.fill();
    g.strokeStyle="rgba(20,50,10,.55)";g.lineWidth=1;g.beginPath();g.moveTo(0,0);g.lineTo(L*.95,0);g.stroke();
    g.fillStyle="rgba(255,255,170,"+(Math.random()*.18)+")";g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(L*.5,-W,L,0);g.lineTo(0,0);g.fill();   // üst yarıya ışık
    g.restore()}
  var t=new THREE.CanvasTexture(c);t.anisotropy=2;return t})();
var leafMat=new THREE.MeshLambertMaterial({map:leafTex,alphaTest:.5,side:THREE.DoubleSide});   // alphaTest: karışım yok → mobilde ucuz
var CARDS=9,LEAF_BASE=crownM.length;
(function(){   // her taç = koyu çekirdek + 9 rastgele yönlü yaprak kartı → hacimli yaprak kümesi
  var core=makeInst(new THREE.IcosahedronGeometry(1,0),new THREE.MeshLambertMaterial({flatShading:true}),crownM.map(function(o){return {x:o.x,y:o.y,z:o.z,s:o.s*.72,c:0x1f4a1c}}),true);
  var m=new THREE.InstancedMesh(new THREE.PlaneGeometry(1,1),leafMat,crownM.length*CARDS),d=new THREE.Object3D(),col=new THREE.Color(),k=0;
  crownM.forEach(function(o){for(var j=0;j<CARDS;j++){var u=new THREE.Vector3(Math.random()-.5,Math.random()-.5,Math.random()-.5).normalize().multiplyScalar(o.s*.55);
    d.position.set(o.x+u.x,o.y+u.y*.8,o.z+u.z);d.rotation.set(Math.random()*6.28,Math.random()*6.28,Math.random()*6.28);var sc=o.s*1.55;d.scale.set(sc,sc,sc);d.updateMatrix();
    m.setMatrixAt(k,d.matrix);m.setColorAt(k,col.set(o.c).offsetHSL(rnd(-.02,.02),0,rnd(-.05,.08)));k++}});
  m.instanceMatrix.needsUpdate=true;m.instanceColor.needsUpdate=true;m.frustumCulled=false;scene.add(m)})();

/* ================= 3) FAKE GOD RAYS ================= */
var rayTex=(function(){var c=document.createElement("canvas");c.width=32;c.height=128;var g=c.getContext("2d");
  var v=g.createLinearGradient(0,0,0,128);v.addColorStop(0,"rgba(255,244,200,1)");v.addColorStop(1,"rgba(255,244,200,0)");g.fillStyle=v;g.fillRect(0,0,32,128);
  g.globalCompositeOperation="destination-in";var h=g.createLinearGradient(0,0,32,0);h.addColorStop(0,"rgba(0,0,0,0)");h.addColorStop(.5,"rgba(0,0,0,1)");h.addColorStop(1,"rgba(0,0,0,0)");g.fillStyle=h;g.fillRect(0,0,32,128);
  return new THREE.CanvasTexture(c)})();
var rayMat=new THREE.MeshBasicMaterial({map:rayTex,color:0xfff0c0,transparent:true,opacity:.38,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide,fog:true});
var rays=[];[{c:main,a:.04,b:F_SPLIT-.02},{c:BR.L,a:.1,b:.92},{c:BR.R,a:.1,b:.92},{c:main,a:F_MERGE+.02,b:.97}].forEach(function(r){
  var n=Math.floor((r.b-r.a)*r.c.getLength()/30);for(var i=0;i<n;i++){var fr=frameAt(r.c,r.a+(r.b-r.a)*i/n),u=rnd(-ROAD_W/2+2,ROAD_W/2-2);
    rays.push({x:fr.p.x+fr.s.x*u,y:fr.p.y,z:fr.p.z+fr.s.z*u,w:rnd(7,13),t:rnd(.15,.4),ry:rnd(0,3.14)})}});
var rayMesh=[0,1].map(function(){var m=new THREE.InstancedMesh(new THREE.PlaneGeometry(1,22),rayMat,rays.length);m.frustumCulled=false;scene.add(m);return m}),dm=new THREE.Object3D();
rays.forEach(function(o,i){[0,1].forEach(function(p){dm.position.set(o.x,o.y+11,o.z);dm.rotation.set(o.t,o.ry+p*Math.PI/2,0);dm.scale.set(o.w,1,1);dm.updateMatrix();rayMesh[p].setMatrixAt(i,dm.matrix)})});   // çapraz iki düzlem
rayMesh.forEach(function(m){m.instanceMatrix.needsUpdate=true});

/* ================= 4) DRON + YOL ALGILAMA ================= */
var drone=new THREE.Group();(function(){var b=new THREE.Mesh(new THREE.ConeGeometry(.9,3,5),new THREE.MeshLambertMaterial({color:0xff8a2a,flatShading:true}));b.rotation.x=Math.PI/2;drone.add(b);
  var w=new THREE.Mesh(new THREE.BoxGeometry(4,.12,.9),new THREE.MeshLambertMaterial({color:0x2fb8ff}));w.position.z=.4;drone.add(w)})();scene.add(drone);
var curTY=0,d=0,speed=42,lat=0,latT=0,route="main",committed=false,keys={l:0,r:0},hud=document.getElementById("hud"),big=document.getElementById("big"),bigT=0;
function routeLen(){return route==="main"?0:BR[route].len}
function pose(dist){
  var l=routeLen(),fr;
  if(dist<DS)fr=frameAt(main,dist/LM);
  else if(route!=="main"&&dist<DS+l)fr=frameAt(BR[route],(dist-DS)/l);
  else if(route==="main")fr=frameAt(main,Math.min(1,dist/LM));
  else fr=frameAt(main,Math.min(1,(DM+(dist-DS-l))/LM));
  return fr}
function say(t){big.textContent=t;big.style.opacity=1;bigT=1.6}
function update(dt){
  d+=(speed-(curTY||0)*34)*dt;latT=(keys.l-keys.r)*(ROAD_W/2-1.6);lat+=(latT-lat)*Math.min(1,dt*4);
  /* YOL AYRIMI: ayrım noktasına gelince dronun yanal konumu (sol +, sağ −) hangi kola gireceğini belirler */
  if(!committed&&d>=DS-4){committed=true;route=lat>=0?"L":"R";say(route==="L"?"◀ SOL TÜNEL":"SAĞ TÜNEL ▶")}
  var end=DS+(route==="main"?0:routeLen())+(LM-DM)-3;
  if(d>=end){d=0;route="main";committed=false;lat=0}
  var fr=pose(d),p=fr.p.clone().addScaledVector(fr.s,lat);p.y+=2.2+Math.sin(performance.now()/300)*.1;
  curTY=fr.tt.y;drone.position.copy(p);drone.lookAt(p.clone().add(fr.tt));drone.rotation.z=-(latT-lat)*.05;
  var cp=fr.p.clone().addScaledVector(fr.t,-10).addScaledVector(fr.s,lat*.6);cp.y=fr.p.y+6;cam.position.lerp(cp,Math.min(1,dt*5));
  cam.lookAt(p.clone().addScaledVector(fr.tt,14));cam.fov+=((70+Math.max(0,-curTY)*60)-cam.fov)*Math.min(1,dt*3);cam.updateProjectionMatrix();
  if(bigT>0){bigT-=dt;if(bigT<=0)big.style.opacity=0}
  var seg=d<DS?"ANA YOL":(route==="main"?"ANA YOL":(d<DS+routeLen()?(route==="L"?"SOL KOL":"SAĞ KOL"):"ANA YOL (birleşti)"));
  hud.innerHTML="Konum: "+seg+"<br>Draw call: "+renderer.info.render.calls+" · üçgen: "+renderer.info.render.triangles+"<br><small>A/D veya ←/→ ya da ekrana dokunup sürükle</small>"}
/* ================= GİRİŞ ================= */
addEventListener("keydown",function(e){if(e.key==="a"||e.key==="ArrowLeft")keys.l=1;if(e.key==="d"||e.key==="ArrowRight")keys.r=1});
addEventListener("keyup",function(e){if(e.key==="a"||e.key==="ArrowLeft")keys.l=0;if(e.key==="d"||e.key==="ArrowRight")keys.r=0});
var tx=null;addEventListener("touchstart",function(e){tx=e.touches[0].clientX},{passive:true});
addEventListener("touchmove",function(e){var dx=e.touches[0].clientX-tx;keys.l=dx<-20?1:0;keys.r=dx>20?1:0},{passive:true});
addEventListener("touchend",function(){keys.l=keys.r=0});
addEventListener("resize",function(){cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
var last=performance.now();cam.position.set(0,6,10);
(function loop(){requestAnimationFrame(loop);var n=performance.now(),dt=Math.min(.05,(n-last)/1000);last=n;update(dt);renderer.render(scene,cam)})();
window.__dbg=function(){return {d:d,route:route,DS:DS,DM:DM,LM:LM,calls:renderer.info.render.calls}};window.__set=function(o){if(o.d!==undefined)d=o.d;if(o.l!==undefined){keys.l=o.l;keys.r=o.r}};
</script></body></html>
